<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANシール・データ作成ツール (PDF / Ai対応)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <!-- JsBarcode (バーコード生成) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- html2canvas & jsPDF (高精度PDF出力用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    #sticker-canvas {
      background-color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
      user-select: none;
      box-sizing: border-box;
    }
    .draggable-element {
      position: absolute;
      cursor: move;
      border: 1px dashed transparent;
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      line-height: 1.25;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .draggable-element:hover {
      border-color: #93c5fd;
    }
    .draggable-element.selected {
      border: 1.5px solid #3b82f6 !important;
    }
    .draggable-element img {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      display: block;
      pointer-events: none;
    }
    .resize-handle {
      width: 10px;
      height: 10px;
      background-color: #3b82f6;
      position: absolute;
      right: -5px;
      bottom: -5px;
      cursor: se-resize;
      display: none;
      border-radius: 2px;
      z-index: 10;
    }
    .draggable-element.selected .resize-handle {
      display: block;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white p-4 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        🏷 JANシールデータ作成アプリ
      </h1>
      <div class="flex gap-2">
        <button id="btn-export-pdf" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-semibold transition flex items-center gap-1 shadow">
          📄 PDFでダウンロード
        </button>
        <button id="btn-export-ai" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition flex items-center gap-1 shadow">
          🎨 Ai互換データ(.svg)でダウンロード
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側：設定パネル -->
    <div class="lg:col-span-5 bg-white p-5 rounded-lg shadow-sm border border-slate-200 space-y-5 overflow-y-auto max-h-[calc(100vh-100px)]">
      
      <!-- プリセット切り替えタブ -->
      <section class="border-b pb-4">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-base font-bold text-slate-700">⚡ プリセット選択</h2>
          <button id="btn-reset-pos" class="text-xs text-blue-600 hover:underline">現在の配置を初期化</button>
        </div>
        <div class="flex gap-2">
          <button id="preset-ydb" class="flex-1 border text-xs py-2 rounded font-semibold transition">YDB (70×40mm)</button>
          <button id="preset-gct" class="flex-1 border text-xs py-2 rounded font-semibold transition">GCT (40×20mm 証紙)</button>
        </div>
        <p class="text-[11px] text-slate-500 mt-2">※プリセットごとに商品名、JAN、上代、サイズなどの入力値が別々に保存されます。</p>
      </section>

      <!-- フォント＆サイズ設定 -->
      <section class="border-b pb-4">
        <h2 class="text-base font-bold text-slate-700 mb-3">🔤 フォント・寸法設定</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">フォント（字体）の選択</label>
            <select id="select-font" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="'Noto Sans JP', sans-serif">角ゴシック (Noto Sans JP)</option>
              <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック (M PLUS Rounded 1c)</option>
              <option value="'Noto Serif JP', serif">明朝体 (Noto Serif JP)</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">横幅 (mm)</label>
              <input type="number" id="seal-width" value="40" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">縦幅 (mm)</label>
              <input type="number" id="seal-height" value="20" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
        </div>
      </section>

      <!-- 選択要素の文字サイズ調整コントローラー -->
      <section id="selected-font-controller" class="p-3 bg-blue-50 border border-blue-200 rounded-md">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-blue-900" id="selected-element-label">🎯 選択中の項目の文字サイズ</label>
          <div class="flex items-center gap-1">
            <input type="number" id="selected-font-size-input" step="0.5" min="3" max="50" class="w-16 border rounded p-1 text-xs font-bold text-center bg-white">
            <span class="text-xs font-semibold text-blue-900">px</span>
          </div>
        </div>
      </section>

      <!-- 必須項目入力 -->
      <section class="border-b pb-4 space-y-3">
        <h2 class="text-base font-bold text-slate-700 flex items-center justify-between">
          <span>📌 基本項目</span>
          <span class="text-xs text-slate-500 font-normal">※商品名・JANは必須</span>
        </h2>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">商品名 (改行対応)</label>
          <textarea id="input-title" rows="2" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none leading-snug"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">JANコード (13桁)</label>
            <input type="text" id="input-jan" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">上代 (税込価格)</label>
            <input type="text" id="input-price" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="未入力なら非表示">
          </div>
        </div>
      </section>

      <!-- 任意項目・画像選択 -->
      <section class="space-y-3">
        <h2 class="text-base font-bold text-slate-700">🧩 任意・追加項目</h2>
        
        <!-- 証紙・ロゴ画像 -->
        <div class="p-3 border rounded bg-slate-50 space-y-2">
          <label class="flex items-center gap-2 font-medium text-sm cursor-pointer">
            <input type="checkbox" id="check-logo" class="rounded text-blue-600">
            <span>証紙・ロゴ画像</span>
          </label>
          <input type="file" id="input-logo-file" accept="image/*" class="text-xs w-full text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- サイズ -->
        <div class="p-3 border rounded bg-slate-50 space-y-2">
          <label class="flex items-center gap-2 font-medium text-sm cursor-pointer">
            <input type="checkbox" id="check-size" class="rounded text-blue-600">
            <span>サイズ情報</span>
          </label>
          <input type="text" id="input-size" class="w-full border rounded p-1.5 text-xs">
        </div>

        <!-- 素材・品質表示 -->
        <div class="p-3 border rounded bg-slate-50 space-y-2">
          <label class="flex items-center gap-2 font-medium text-sm cursor-pointer">
            <input type="checkbox" id="check-material" class="rounded text-blue-600">
            <span>素材・品質表示</span>
          </label>
          <textarea id="input-material" rows="2" class="w-full border rounded p-1.5 text-xs"></textarea>
        </div>

        <!-- 販売元情報 -->
        <div class="p-3 border rounded bg-slate-50 space-y-2">
          <label class="flex items-center gap-2 font-medium text-sm cursor-pointer">
            <input type="checkbox" id="check-vendor" class="rounded text-blue-600">
            <span>販売元・事業者情報</span>
          </label>
          <textarea id="input-vendor" rows="2" class="w-full border rounded p-1.5 text-xs" placeholder="発売元：株式会社〇〇&#10;TEL：03-0000-0000"></textarea>
        </div>

        <!-- 原産国 -->
        <div class="p-3 border rounded bg-slate-50 space-y-2">
          <label class="flex items-center gap-2 font-medium text-sm cursor-pointer">
            <input type="checkbox" id="check-origin" class="rounded text-blue-600">
            <span>原産国表記</span>
          </label>
          <input type="text" id="input-origin" class="w-full border rounded p-1.5 text-xs">
        </div>

        <!-- フリー項目 -->
        <div class="p-3 border rounded bg-slate-50 space-y-2">
          <label class="flex items-center gap-2 font-medium text-sm cursor-pointer">
            <input type="checkbox" id="check-free" class="rounded text-blue-600">
            <span>フリーテキスト項目</span>
          </label>
          <textarea id="input-free" rows="2" class="w-full border rounded p-1.5 text-xs" placeholder="型番、SKU、注意書きなど"></textarea>
        </div>

      </section>
    </div>

    <!-- 右側：キャンバスエリア -->
    <div class="lg:col-span-7 flex flex-col items-center">
      <div class="w-full bg-slate-200 p-3 rounded-t-lg border flex justify-between items-center text-xs text-slate-600">
        <span>💡 項目をクリックして選択・文字サイズ変更 / ドラッグで移動</span>
        <span id="canvas-size-indicator" class="font-bold text-slate-800">40mm × 20mm</span>
      </div>
      
      <div class="w-full bg-slate-300 p-8 rounded-b-lg flex items-center justify-center overflow-auto min-h-[500px]">
        <div id="sticker-canvas" class="relative bg-white border border-red-300">
          <!-- 要素動的描画 -->
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentPreset = 'gct';
    let MM_TO_PX = 7.5;
    let currentlySelectedKey = 'title';

    const presetStore = {
      ydb: {
        width: 70,
        height: 40,
        font: "'Noto Sans JP', sans-serif",
        title: "YDB×Seiji Matsumoto/ナイロンポーチ/DBS",
        jan: "4573676225672",
        price: "",
        size: "W270mm × H190mm × D85mm",
        material: "表地：ナイロン\n裏地：ポリエステル",
        vendor: "発売元：株式会社サンプル\nTEL：03-0000-0000",
        origin: "MADE IN CHINA",
        free: "",
        checks: {
          logo: false,
          size: true,
          material: true,
          vendor: false,
          origin: true,
          free: false
        },
        logoDataUrl: null,
        elements: {
          title: { id: 'title', label: '商品名', type: 'text', text: '', x: 3.8, y: 3.2, w: 62.0, h: 5.5, fontSize: 8.5, fontWeight: 'bold' },
          price: { id: 'price', label: '価格', type: 'text', text: '', x: 26.0, y: 11.5, w: 41.0, h: 5.0, fontSize: 8.0, fontWeight: 'bold' },
          size: { id: 'size', label: 'サイズ', type: 'text', text: '', x: 3.8, y: 7.2, w: 62.0, h: 3.8, fontSize: 6.0, fontWeight: 'normal' },
          material: { id: 'material', label: '素材', type: 'text', text: '', x: 3.8, y: 9.6, w: 62.0, h: 6.8, fontSize: 6.0, fontWeight: 'normal' },
          origin: { id: 'origin', label: '原産国', type: 'text', text: '', x: 3.8, y: 33.6, w: 26.0, h: 3.8, fontSize: 6.0, fontWeight: 'normal' },
          vendor: { id: 'vendor', label: '販売元', type: 'text', text: '', x: 4.0, y: 23.0, w: 28.0, h: 8.0, fontSize: 6.0, fontWeight: 'normal' },
          free: { id: 'free', label: 'フリー項目', type: 'text', text: '', x: 4.0, y: 18.0, w: 28.0, h: 6.0, fontSize: 6.0, fontWeight: 'normal' },
          barcode: { id: 'barcode', label: 'バーコード', type: 'barcode', code: '', x: 28.8, y: 25.5, w: 37.8, h: 12.5 },
          logo: { id: 'logo', label: '証紙ロゴ', type: 'image', x: 2.0, y: 1.5, w: 8.4, h: 17.0 }
        }
      },
      gct: {
        width: 40,
        height: 20,
        font: "'Noto Sans JP', sans-serif",
        title: "THUNDERS DONUT\nイラストポーチ巾着",
        jan: "2607903799390",
        price: "1,900円(税込)",
        size: "",
        material: "",
        vendor: "",
        origin: "MADE IN CHINA",
        free: "",
        checks: {
          logo: true,
          size: false,
          material: false,
          vendor: false,
          origin: true,
          free: false
        },
        logoDataUrl: localStorage.getItem('jan_app_gct_logo') || null,
        elements: {
          // 商品名: 文字サイズ 6.0
          title: { id: 'title', label: '商品名', type: 'text', text: '', x: 14.5, y: 1.5, w: 24.5, h: 5.4, fontSize: 6.0, fontWeight: 'bold' },
          // 価格: 文字サイズ 6.0
          price: { id: 'price', label: '価格', type: 'text', text: '', x: 14.5, y: 6.9, w: 24.5, h: 3.2, fontSize: 6.0, fontWeight: 'bold' },
          size: { id: 'size', label: 'サイズ', type: 'text', text: '', x: 4, y: 10, w: 62, h: 4.5, fontSize: 7.5, fontWeight: 'normal' },
          material: { id: 'material', label: '素材', type: 'text', text: '', x: 4, y: 14.5, w: 62, h: 8, fontSize: 7.5, fontWeight: 'normal' },
          // 原産国表記: 文字サイズ 4.0、バーコードギリギリ右上、右端をバーコードガードバー(37.3mm)に揃える
          origin: { id: 'origin', label: '原産国', type: 'text', text: '', x: 22.3, y: 11.2, w: 15.0, h: 2.2, fontSize: 4.0, fontWeight: 'normal', textAlign: 'right' },
          vendor: { id: 'vendor', label: '販売元', type: 'text', text: '', x: 4, y: 23, w: 28, h: 8, fontSize: 7, fontWeight: 'normal' },
          free: { id: 'free', label: 'フリー項目', type: 'text', text: '', x: 4, y: 18, w: 28, h: 6, fontSize: 7, fontWeight: 'normal' },
          // バーコード: 位置をさらに下へ (y: 13.5mm, h: 5.6mm)
          barcode: { id: 'barcode', label: 'バーコード', type: 'barcode', code: '', x: 13.8, y: 13.5, w: 24.5, h: 5.6 },
          logo: { id: 'logo', label: '証紙ロゴ', type: 'image', x: 2.2, y: 1.4, w: 8.2, h: 17.0 }
        }
      }
    };

    const canvas = document.getElementById('sticker-canvas');

    function saveCurrentInputsToStore() {
      const data = presetStore[currentPreset];
      data.width = parseFloat(document.getElementById('seal-width').value) || data.width;
      data.height = parseFloat(document.getElementById('seal-height').value) || data.height;
      data.font = document.getElementById('select-font').value;
      data.title = document.getElementById('input-title').value;
      data.jan = document.getElementById('input-jan').value;
      data.price = document.getElementById('input-price').value;
      data.size = document.getElementById('input-size').value;
      data.material = document.getElementById('input-material').value;
      data.vendor = document.getElementById('input-vendor').value;
      data.origin = document.getElementById('input-origin').value;
      data.free = document.getElementById('input-free').value;

      data.checks.logo = document.getElementById('check-logo').checked;
      data.checks.size = document.getElementById('check-size').checked;
      data.checks.material = document.getElementById('check-material').checked;
      data.checks.vendor = document.getElementById('check-vendor').checked;
      data.checks.origin = document.getElementById('check-origin').checked;
      data.checks.free = document.getElementById('check-free').checked;
    }

    function loadPresetToInputs(presetKey) {
      currentPreset = presetKey;
      const data = presetStore[presetKey];

      document.getElementById('seal-width').value = data.width;
      document.getElementById('seal-height').value = data.height;
      document.getElementById('select-font').value = data.font;
      document.getElementById('input-title').value = data.title;
      document.getElementById('input-jan').value = data.jan;
      document.getElementById('input-price').value = data.price;
      document.getElementById('input-size').value = data.size;
      document.getElementById('input-material').value = data.material;
      document.getElementById('input-vendor').value = data.vendor;
      document.getElementById('input-origin').value = data.origin;
      document.getElementById('input-free').value = data.free;

      document.getElementById('check-logo').checked = data.checks.logo;
      document.getElementById('check-size').checked = data.checks.size;
      document.getElementById('check-material').checked = data.checks.material;
      document.getElementById('check-vendor').checked = data.checks.vendor;
      document.getElementById('check-origin').checked = data.checks.origin;
      document.getElementById('check-free').checked = data.checks.free;

      if (presetKey === 'ydb') {
        document.getElementById('preset-ydb').className = 'flex-1 bg-blue-50 border-blue-400 text-blue-800 border text-xs py-2 rounded font-bold shadow-sm';
        document.getElementById('preset-gct').className = 'flex-1 bg-slate-100 hover:bg-slate-200 border text-xs py-2 rounded font-medium text-slate-700';
      } else {
        document.getElementById('preset-gct').className = 'flex-1 bg-blue-50 border-blue-400 text-blue-800 border text-xs py-2 rounded font-bold shadow-sm';
        document.getElementById('preset-ydb').className = 'flex-1 bg-slate-100 hover:bg-slate-200 border text-xs py-2 rounded font-medium text-slate-700';
      }

      currentlySelectedKey = 'title';
      renderCanvas();
    }

    function updateCanvasSize() {
      const data = presetStore[currentPreset];
      const wMM = parseFloat(document.getElementById('seal-width').value) || data.width;
      const hMM = parseFloat(document.getElementById('seal-height').value) || data.height;
      MM_TO_PX = (wMM <= 45) ? 7.5 : 4.2;

      canvas.style.width = `${Math.round(wMM * MM_TO_PX)}px`;
      canvas.style.height = `${Math.round(hMM * MM_TO_PX)}px`;
      document.getElementById('canvas-size-indicator').innerText = `${wMM}mm × ${hMM}mm`;
    }

    function renderCanvas() {
      updateCanvasSize();
      canvas.innerHTML = '';

      const data = presetStore[currentPreset];
      const elements = data.elements;
      const selectedFont = document.getElementById('select-font').value;
      canvas.style.fontFamily = selectedFont;

      const rawTitle = document.getElementById('input-title').value;
      const rawPrice = document.getElementById('input-price').value.trim();

      if (currentPreset === 'gct') {
        const lines = rawTitle.split('\n');
        if (lines.length > 1) {
          elements.title.text = `商品名：${lines[0]}\n    ${lines.slice(1).join('\n')}`;
        } else {
          elements.title.text = `商品名：${rawTitle}`;
        }
        elements.price.text = rawPrice ? `価 格：${rawPrice}` : '';
      } else {
        elements.title.text = rawTitle;
        elements.price.text = rawPrice ? `価 格：${rawPrice}` : '';
      }

      elements.barcode.code = document.getElementById('input-jan').value;
      elements.size.text = `〈サイズ〉${document.getElementById('input-size').value}`;
      
      const matVal = document.getElementById('input-material').value;
      elements.material.text = matVal ? `〈素材〉${matVal}` : '';
      
      elements.origin.text = document.getElementById('input-origin').value;
      elements.vendor.text = document.getElementById('input-vendor').value;
      elements.free.text = document.getElementById('input-free').value;

      const activeKeys = ['title', 'barcode'];
      if (rawPrice) {
        activeKeys.push('price');
      }
      if (document.getElementById('check-logo').checked) activeKeys.push('logo');
      if (document.getElementById('check-size').checked) activeKeys.push('size');
      if (document.getElementById('check-material').checked) activeKeys.push('material');
      if (document.getElementById('check-origin').checked) activeKeys.push('origin');
      if (document.getElementById('check-vendor').checked) activeKeys.push('vendor');
      if (document.getElementById('check-free').checked) activeKeys.push('free');

      activeKeys.forEach(key => {
        const item = elements[key];
        const el = document.createElement('div');
        el.className = 'draggable-element';
        el.id = `el-${item.id}`;
        el.dataset.key = key;
        el.style.left = `${item.x * MM_TO_PX}px`;
        el.style.top = `${item.y * MM_TO_PX}px`;
        el.style.width = `${item.w * MM_TO_PX}px`;
        el.style.height = `${item.h * MM_TO_PX}px`;

        if (item.type === 'text') {
          const renderFontSize = item.fontSize * (MM_TO_PX / 3.78);
          el.style.fontSize = `${renderFontSize}px`;
          el.style.fontWeight = item.fontWeight;
          el.style.fontFamily = selectedFont;
          if (item.textAlign === 'right') {
            el.style.justifyContent = 'flex-end';
            el.style.textAlign = 'right';
          }
          el.innerText = item.text;
        } else if (item.type === 'barcode') {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.style.width = '100%';
          svg.style.height = '100%';
          
          try {
            JsBarcode(svg, item.code, {
              format: "EAN13",
              margin: 0,
              displayValue: true,
              flat: false,
              height: currentPreset === 'gct' ? 22 : 36,
              fontSize: currentPreset === 'gct' ? 11 : 12,
              fontOptions: "bold",
              textMargin: 0
            });
          } catch(e) {
            JsBarcode(svg, "2607903799390", { format: "EAN13", margin: 0, displayValue: true, flat: false, height: 22, fontSize: 11 });
          }
          el.appendChild(svg);
        } else if (item.type === 'image') {
          if (data.logoDataUrl) {
            const img = document.createElement('img');
            img.src = data.logoDataUrl;
            el.appendChild(img);
          } else {
            el.innerHTML = `
              <div class="w-full h-full border-2 border-dashed border-blue-400 bg-blue-50/70 rounded flex flex-col items-center justify-center p-1 text-center cursor-pointer hover:bg-blue-100 transition">
                <span class="text-sm">📷</span>
                <span class="text-[9px] font-bold text-blue-700 leading-tight">クリックして<br>証紙画像を選択</span>
              </div>
            `;
            el.onclick = () => document.getElementById('input-logo-file').click();
          }

          el.addEventListener('dragover', (e) => { e.preventDefault(); el.style.filter = 'brightness(0.9)'; });
          el.addEventListener('dragleave', () => { el.style.filter = 'none'; });
          el.addEventListener('drop', (e) => {
            e.preventDefault();
            el.style.filter = 'none';
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
              loadLogoFile(e.dataTransfer.files[0]);
            }
          });
        }

        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        el.appendChild(handle);

        if (key === currentlySelectedKey) {
          el.classList.add('selected');
        }

        makeInteractable(el, item);
        canvas.appendChild(el);
      });

      updateFontSizeController();
    }

    function updateFontSizeController() {
      const data = presetStore[currentPreset];
      const item = data.elements[currentlySelectedKey];
      const controller = document.getElementById('selected-font-controller');
      const label = document.getElementById('selected-element-label');
      const input = document.getElementById('selected-font-size-input');

      if (item && item.type === 'text') {
        controller.style.display = 'block';
        label.innerText = `🎯「${item.label}」の文字サイズ`;
        input.value = item.fontSize;
      } else {
        controller.style.display = 'none';
      }
    }

    document.getElementById('selected-font-size-input').addEventListener('input', (e) => {
      const newSize = parseFloat(e.target.value);
      const data = presetStore[currentPreset];
      if (newSize && data.elements[currentlySelectedKey]) {
        data.elements[currentlySelectedKey].fontSize = newSize;
        const el = document.getElementById(`el-${currentlySelectedKey}`);
        if (el) {
          el.style.fontSize = `${newSize * (MM_TO_PX / 3.78)}px`;
        }
      }
    });

    function makeInteractable(el, item) {
      let isDragging = false;
      let isResizing = false;
      let startX, startY, startW, startH, startLeft, startTop;

      el.addEventListener('mousedown', (e) => {
        document.querySelectorAll('.draggable-element').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');
        currentlySelectedKey = el.dataset.key;
        updateFontSizeController();

        if (e.target.classList.contains('resize-handle')) {
          isResizing = true;
        } else {
          isDragging = true;
        }

        startX = e.clientX;
        startY = e.clientY;
        startW = item.w * MM_TO_PX;
        startH = item.h * MM_TO_PX;
        startLeft = item.x * MM_TO_PX;
        startTop = item.y * MM_TO_PX;

        e.stopPropagation();
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          item.x = Math.max(0, (startLeft + dx) / MM_TO_PX);
          item.y = Math.max(0, (startTop + dy) / MM_TO_PX);
          el.style.left = `${item.x * MM_TO_PX}px`;
          el.style.top = `${item.y * MM_TO_PX}px`;
        } else if (isResizing) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (item.type === 'image') {
            const aspect = 8.2 / 17.0;
            const newH = Math.max(5, (startH + dy) / MM_TO_PX);
            item.h = newH;
            item.w = newH * aspect;
          } else {
            item.w = Math.max(3, (startW + dx) / MM_TO_PX);
            item.h = Math.max(2, (startH + dy) / MM_TO_PX);
          }
          el.style.width = `${item.w * MM_TO_PX}px`;
          el.style.height = `${item.h * MM_TO_PX}px`;
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        isResizing = false;
      });
    }

    function loadLogoFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const url = event.target.result;
        presetStore[currentPreset].logoDataUrl = url;
        if (currentPreset === 'gct') {
          try {
            localStorage.setItem('jan_app_gct_logo', url);
          } catch(e) {}
        }
        document.getElementById('check-logo').checked = true;
        presetStore[currentPreset].checks.logo = true;
        renderCanvas();
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('input-logo-file').addEventListener('change', (e) => {
      loadLogoFile(e.target.files[0]);
    });

    document.getElementById('preset-ydb').addEventListener('click', () => {
      if (currentPreset !== 'ydb') {
        saveCurrentInputsToStore();
        loadPresetToInputs('ydb');
      }
    });

    document.getElementById('preset-gct').addEventListener('click', () => {
      if (currentPreset !== 'gct') {
        saveCurrentInputsToStore();
        loadPresetToInputs('gct');
      }
    });

    // 初期化ボタン
    document.getElementById('btn-reset-pos').addEventListener('click', () => {
      if (currentPreset === 'ydb') {
        presetStore.ydb.elements.title.x = 3.8; presetStore.ydb.elements.title.y = 3.2; presetStore.ydb.elements.title.w = 62.0; presetStore.ydb.elements.title.h = 5.5; presetStore.ydb.elements.title.fontSize = 8.5;
        presetStore.ydb.elements.size.x = 3.8; presetStore.ydb.elements.size.y = 7.2; presetStore.ydb.elements.size.w = 62.0; presetStore.ydb.elements.size.h = 3.8; presetStore.ydb.elements.size.fontSize = 6.0;
        presetStore.ydb.elements.material.x = 3.8; presetStore.ydb.elements.material.y = 9.6; presetStore.ydb.elements.material.w = 62.0; presetStore.ydb.elements.material.h = 6.8; presetStore.ydb.elements.material.fontSize = 6.0;
        presetStore.ydb.elements.origin.x = 3.8; presetStore.ydb.elements.origin.y = 33.6; presetStore.ydb.elements.origin.w = 26.0; presetStore.ydb.elements.origin.h = 3.8; presetStore.ydb.elements.origin.fontSize = 6.0;
        presetStore.ydb.elements.barcode.x = 28.8; presetStore.ydb.elements.barcode.y = 25.5; presetStore.ydb.elements.barcode.w = 37.8; presetStore.ydb.elements.barcode.h = 12.5;
      } else {
        presetStore.gct.elements.logo.x = 2.2; presetStore.gct.elements.logo.y = 1.4; presetStore.gct.elements.logo.w = 8.2; presetStore.gct.elements.logo.h = 17.0;
        presetStore.gct.elements.title.x = 14.5; presetStore.gct.elements.title.y = 1.5; presetStore.gct.elements.title.w = 24.5; presetStore.gct.elements.title.h = 5.4; presetStore.gct.elements.title.fontSize = 6.0;
        presetStore.gct.elements.price.x = 14.5; presetStore.gct.elements.price.y = 6.9; presetStore.gct.elements.price.w = 24.5; presetStore.gct.elements.price.h = 3.2; presetStore.gct.elements.price.fontSize = 6.0;
        presetStore.gct.elements.origin.x = 22.3; presetStore.gct.elements.origin.y = 11.2; presetStore.gct.elements.origin.w = 15.0; presetStore.gct.elements.origin.h = 2.2; presetStore.gct.elements.origin.fontSize = 4.0;
        presetStore.gct.elements.barcode.x = 13.8; presetStore.gct.elements.barcode.y = 13.5; presetStore.gct.elements.barcode.w = 24.5; presetStore.gct.elements.barcode.h = 5.6;
      }
      renderCanvas();
    });

    document.querySelectorAll('input, select, textarea').forEach(input => {
      input.addEventListener('input', () => {
        saveCurrentInputsToStore();
        renderCanvas();
      });
      input.addEventListener('change', () => {
        saveCurrentInputsToStore();
        renderCanvas();
      });
    });

    // 1. PDF出力機能
    document.getElementById('btn-export-pdf').addEventListener('click', async () => {
      document.querySelectorAll('.draggable-element').forEach(d => d.classList.remove('selected'));
      
      const wMM = parseFloat(document.getElementById('seal-width').value) || 40;
      const hMM = parseFloat(document.getElementById('seal-height').value) || 20;

      const prevBorder = canvas.style.border;
      canvas.style.border = 'none';

      try {
        const capturedCanvas = await html2canvas(canvas, {
          scale: 4,
          useCORS: true,
          logging: false,
          width: canvas.offsetWidth,
          height: canvas.offsetHeight
        });

        const imgData = capturedCanvas.toDataURL('image/jpeg', 1.0);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: wMM >= hMM ? 'landscape' : 'portrait',
          unit: 'mm',
          format: [wMM, hMM]
        });

        pdf.addImage(imgData, 'JPEG', 0, 0, wMM, hMM);
        pdf.save(`JAN_${currentPreset.toUpperCase()}_${wMM}x${hMM}mm.pdf`);
      } catch (err) {
        alert('PDF生成エラー: ' + err.message);
      } finally {
        canvas.style.border = prevBorder;
      }
    });

    // 2. Ai互換データ (SVG) 出力機能
    document.getElementById('btn-export-ai').addEventListener('click', () => {
      document.querySelectorAll('.draggable-element').forEach(d => d.classList.remove('selected'));
      const wMM = parseFloat(document.getElementById('seal-width').value) || 40;
      const hMM = parseFloat(document.getElementById('seal-height').value) || 20;
      const totalWidthPx = Math.round(wMM * MM_TO_PX);
      const totalHeightPx = Math.round(hMM * MM_TO_PX);
      
      let svgContent = `<?xml version="1.0" encoding="utf-8"?>\n`;
      svgContent += `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${wMM}mm" height="${hMM}mm" viewBox="0 0 ${totalWidthPx} ${totalHeightPx}">\n`;
      svgContent += `  <rect width="${totalWidthPx}" height="${totalHeightPx}" fill="#ffffff"/>\n`;
      
      canvas.querySelectorAll('.draggable-element').forEach(el => {
        const left = parseFloat(el.style.left);
        const top = parseFloat(el.style.top);
        const elWidth = parseFloat(el.style.width);
        const elHeight = parseFloat(el.style.height);
        const font = el.style.fontFamily || 'sans-serif';
        const fontSize = el.style.fontSize;
        const fontWeight = el.style.fontWeight || 'normal';
        const isRightAlign = el.style.textAlign === 'right';
        
        const innerSvg = el.querySelector('svg');
        const innerImg = el.querySelector('img');
        
        if (innerSvg) {
          const clonedSvg = innerSvg.cloneNode(true);
          const viewBox = innerSvg.getAttribute('viewBox');
          let vbAttr = viewBox ? ` viewBox="${viewBox}"` : '';
          
          svgContent += `  <g transform="translate(${left}, ${top})">\n`;
          svgContent += `    <svg width="${elWidth}" height="${elHeight}"${vbAttr} overflow="visible">\n`;
          svgContent += `      ${clonedSvg.innerHTML}\n`;
          svgContent += `    </svg>\n`;
          svgContent += `  </g>\n`;
        } else if (innerImg && innerImg.src) {
          svgContent += `  <image xlink:href="${innerImg.src}" x="${left}" y="${top}" width="${elWidth}" height="${elHeight}" preserveAspectRatio="xMidYMid meet"/>\n`;
        } else {
          const lines = el.innerText.split('\n');
          const cleanFont = font.replace(/"/g, "'");
          lines.forEach((line, index) => {
            const lineY = top + parseFloat(fontSize) + (index * parseFloat(fontSize) * 1.25);
            const anchor = isRightAlign ? ` text-anchor="end"` : ``;
            const textX = isRightAlign ? (left + elWidth) : left;
            svgContent += `  <text x="${textX}" y="${lineY}" font-family="${cleanFont}" font-size="${fontSize}" font-weight="${fontWeight}" fill="#000000"${anchor}>${line}</text>\n`;
          });
        }
      });
      
      svgContent += `</svg>`;
      
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `JAN_${currentPreset.toUpperCase()}_${wMM}x${hMM}mm_Ai.svg`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 初期起動時：GCTプリセットを表示
    loadPresetToInputs('gct');
  </script>
</body>
</html>
